message DotGrpcCommand {
  option (bareos.command_name) = ".grpc";
  option (bareos.help_text) = "Switch to gRPC/Protobuf response mode";
  option (bareos.usage) = ".grpc [on | off] [format=<proto|json|text>] [compact=<yes|no>]";
  option (bareos.audit_event) = true;

  bool on = 1   [(bareos.bare_flag) = true];
  bool off = 2  [(bareos.bare_flag) = true];
  // Response serialization: "proto" (binary protobuf), "json" (JSON), "text" (human-readable)
  string format = 3;
  // Compact output (no indentation/newlines)
  string compact = 4;
}

