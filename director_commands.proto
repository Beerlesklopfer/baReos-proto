// ==========================================================================
// configure — Configure director resources (add, delete, update, export)
// ==========================================================================

// Supported resource types for configure subcommands
enum ConfigureResourceType {
  CONFIGURE_RESOURCE_UNSPECIFIED = 0;
  CONFIGURE_RESOURCE_CLIENT = 1;
  CONFIGURE_RESOURCE_JOBDEFS = 2;
  CONFIGURE_RESOURCE_JOB = 3;
  CONFIGURE_RESOURCE_STORAGE = 4;
  CONFIGURE_RESOURCE_CATALOG = 5;
  CONFIGURE_RESOURCE_SCHEDULE = 6;
  CONFIGURE_RESOURCE_FILESET = 7;
  CONFIGURE_RESOURCE_POOL = 8;
  CONFIGURE_RESOURCE_MESSAGES = 9;
  CONFIGURE_RESOURCE_COUNTER = 10;
  CONFIGURE_RESOURCE_PROFILE = 11;
  CONFIGURE_RESOURCE_CONSOLE = 12;
  CONFIGURE_RESOURCE_USER = 13;
}

// configure add <resourcetype> name=<name> key=value ...
message ConfigureAddCommand {
  option (bareos.command_name) = "configure add";
  option (bareos.help_text) = "Add a new director resource";
  option (bareos.usage) = "configure add <resourcetype> name=<name> "
                          "[key=value ...]";
  option (bareos.audit_event) = true;

  ConfigureResourceType resource_type = 1 [(bareos.required) = true];
  string name = 2   [(bareos.required) = true];
  // Additional key=value pairs as resource directives
  map<string, string> directives = 3;
}

// configure delete <resourcetype> name=<name> [yes]
message ConfigureDeleteCommand {
  option (bareos.command_name) = "configure delete";
  option (bareos.help_text) = "Delete a director resource";
  option (bareos.usage) = "configure delete <resourcetype> name=<name> [yes]";
  option (bareos.audit_event) = true;

  ConfigureResourceType resource_type = 1 [(bareos.required) = true];
  string name = 2   [(bareos.required) = true];
  bool yes = 3      [(bareos.bare_flag) = true];
}

// configure update <resourcetype> name=<name> key=value ...
message ConfigureUpdateCommand {
  option (bareos.command_name) = "configure update";
  option (bareos.help_text) = "Update an existing director resource";
  option (bareos.usage) = "configure update <resourcetype> name=<name> "
                          "key=value [key=value ...]";
  option (bareos.audit_event) = true;

  ConfigureResourceType resource_type = 1 [(bareos.required) = true];
  string name = 2   [(bareos.required) = true];
  // Key=value pairs to update
  map<string, string> directives = 3;
}

// configure export client=<client>
message ConfigureExportCommand {
  option (bareos.command_name) = "configure export";
  option (bareos.help_text) = "Export client configuration for File Daemon";
  option (bareos.usage) = "configure export client=<client-name>";
  option (bareos.audit_event) = true;

  string client = 1 [(bareos.required) = true];
}

