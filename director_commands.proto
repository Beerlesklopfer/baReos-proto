syntax = "proto3";
package bareos.director.commands;

import "bareos_options.proto";

// ==========================================================================
// status — Report status
// ==========================================================================

message StatusCommand {
  option (bareos.command_name) = "status";
  option (bareos.help_text) = "Report status";
  option (bareos.usage) = "status [all | dir | days=<nn> | "
                          "client[=<client-name>] | storage[=<storage-name>] | "
                          "schedule[=<schedule-name>] | "
                          "subscriptions | configuration | "
                          "[header] [running] [terminated]]";
  option (bareos.audit_event) = true;

  bool all = 1         [(bareos.bare_flag) = true];
  bool dir = 2         [(bareos.bare_flag) = true];
  string client = 3;
  string storage = 4;
  string schedule = 5;
  int32 days = 6;
  bool subscriptions = 7 [(bareos.bare_flag) = true];
  bool configuration = 8 [(bareos.bare_flag) = true];
  bool header = 9      [(bareos.bare_flag) = true];
  bool running = 10    [(bareos.bare_flag) = true];
  bool terminated = 11 [(bareos.bare_flag) = true];
}

// ==========================================================================
// run — Run a job
// ==========================================================================

message RunCommand {
  option (bareos.command_name) = "run";
  option (bareos.help_text) = "Run a job";
  option (bareos.usage) = "run [job=<job-name>] [client=<client-name>] "
                          "[fileset=<fileset-name>] [level=<level>] "
                          "[storage=<storage-name>] [where=<path>] "
                          "[when=<universal-time-specification>] "
                          "[pool=<pool-name>] [pluginoptions=<options>] "
                          "[accurate=<yes|no>] [comment=<text>] "
                          "[spooldata=<yes|no>] [priority=<number>] "
                          "[jobid=<number>] [catalog=<catalog-name>] [yes]";
  option (bareos.audit_event) = true;

  string job = 1;
  string client = 2;
  string fileset = 3;
  string level = 4;
  string storage = 5;
  string where = 6;
  string when = 7;
  string pool = 8;
  string pluginoptions = 9;
  string accurate = 10;
  string comment = 11;
  string spooldata = 12;
  int32 priority = 13;
  int32 jobid = 14;
  string catalog = 15;
  bool yes = 16 [(bareos.bare_flag) = true];
}

