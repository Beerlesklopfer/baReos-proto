//
// Typisierte Director-API (DirectorApi).
//
// Ergaenzt den Dienst "Director" (director_service.proto) um typisierte
// RPCs: je Befehl bzw. Unterbefehl eine RPC, deren Antwort eine
// strukturierte Message statt Text/JSON ist. Rein additiv; bestehende
// Messages, Felder und RPCs bleiben unveraendert.
//
// Konventionen dieser Datei:
//   - Requests sind *Command-Messages mit den Optionen aus
//     bareos_options.proto (command_name, help_text, usage ...). Wo eine
//     Message aus director_commands.proto alle Parameter einer Unterform
//     enthaelt, wird sie wiederverwendet; neue Requests nur, wo keine passt.
//     command_name enthaelt das Unterkommando ("list jobs"), wie bei
//     ConfigureAddCommand ("configure add").
//   - Request-Felder heissen wie die Konsolen-Schluesselwoerter (jobid,
//     ujobid, ...); bool-Felder mit bare_flag sind Schluesselwoerter ohne Wert.
//     Das Feld "llist" waehlt die Langform (llist statt list).
//   - Ergebnis-Datensaetze heissen *Info (wie ServerInfo, CommandInfo),
//     RPC-Antworten *Response. Feldnamen der Datensaetze sind die Schluessel
//     der API-2-JSON-Ausgabe (".api 2") des Directors bzw. die
//     Katalogspalten in Kleinschreibung ("-" wird zu "_").
//   - Zeitangaben bleiben Text im Format des Directors
//     ("YYYY-MM-DD HH:MM:SS", Ortszeit des Directors), weil der Katalog sie
//     ohne Zeitzone speichert; Unix-Zeitstempel sind int64 (wie in
//     director_service.proto).
//   - Byte-Zaehler sind uint64, IDs uint32, Zaehler uint32/uint64.
//   - Enums: <ENUM_NAME>_UNSPECIFIED = 0. Bei JobStatus, JobType und
//     JobLevel ist der Zahlenwert der ASCII-Code des Katalogzeichens
//     (JOB_STATUS_TERMINATED = 84 = 'T').
//   - extra_fields (Feldnummer 100): Werte der JSON-Ausgabe, fuer die es
//     (noch) kein typisiertes Feld gibt oder die sich nicht verlustfrei
//     umwandeln lassen, als JSON-Text. Damit geht kein Wert verloren.
//
// Authentifizierung: wie beim Dienst "Director" (Login, Metadata-Header
// "x-onesimus-session"). Jede RPC laeuft mit den ACLs der angemeldeten
// Konsole durch dieselbe Befehlsimplementierung wie der Konsolenbefehl.
//
// Fehler: Befehl nicht erlaubt (CommandACL) -> PERMISSION_DENIED,
// Befehl fehlgeschlagen -> FAILED_PRECONDITION mit den Fehlermeldungen,
// noch nicht implementiert (Schreib-RPCs, S-35) -> UNIMPLEMENTED.

syntax = "proto3";
package bareos.director.api;

import "bareos_options.proto";
import "director_commands.proto";
import "google/protobuf/struct.proto";

// ==========================================================================
// DirectorApi Service
// ==========================================================================

service DirectorApi {
  // ------------------------------------------------------------------------
  // Info, Hilfe, Meldungen (lesend, implementiert)
  // ------------------------------------------------------------------------

  // version
  rpc GetVersion (bareos.director.commands.VersionCommand) returns (VersionResponse);
  // time
  rpc GetTime (bareos.director.commands.TimeCommand) returns (TimeResponse);
  // whoami
  rpc Whoami (bareos.director.commands.WhoamiCommand) returns (WhoamiResponse);
  // memory
  rpc GetMemory (bareos.director.commands.MemoryCommand) returns (MemoryResponse);
  // . (no op)
  rpc Noop (bareos.director.commands.DotCommand) returns (NoopResponse);
  // help [<command>]
  rpc Help (HelpTopicCommand) returns (HelpResponse);
  // .help [all] [item=<command>] [full]
  rpc DotHelp (DotHelpTopicCommand) returns (HelpResponse);
  // messages (holt die wartenden Meldungen der Konsole ab)
  rpc GetMessages (bareos.director.commands.MessagesCommand) returns (MessagesResponse);
  // .messages
  rpc DotMessages (bareos.director.commands.DotMessagesCommand) returns (MessagesResponse);
  // var <text>
  rpc ExpandVariables (VarExpandCommand) returns (TextResponse);
  // resolve [client=<name> | storage=<name>] <hostname>
  rpc Resolve (ResolveHostCommand) returns (TextResponse);
  // estimate job=<name> ... (fragt den File Daemon, aendert nichts)
  rpc Estimate (bareos.director.commands.EstimateCommand) returns (TextResponse);

  // ------------------------------------------------------------------------
  // list / llist (lesend, implementiert)
  // ------------------------------------------------------------------------

  // list jobs [job=] [client=] [jobstatus=] ... | list job=<name> ...
  rpc ListJobs (ListJobsCommand) returns (ListJobsResponse);
  // list jobid=<id> | list ujobid=<name>
  rpc GetJob (ListJobidCommand) returns (ListJobsResponse);
  // list backups client=<name> ...
  rpc ListBackups (ListBackupsCommand) returns (ListJobsResponse);
  // list copies [jobid=<ids>]
  rpc ListCopies (ListCopiesCommand) returns (ListCopiesResponse);
  // list joblog jobid=<id> [count]
  rpc ListJobLog (ListJoblogCommand) returns (ListJobLogResponse);
  // list jobmedia jobid=<id>
  rpc ListJobMedia (ListJobmediaCommand) returns (ListJobMediaResponse);
  // list jobtotals
  rpc ListJobTotals (ListJobtotalsCommand) returns (ListJobTotalsResponse);
  // list jobstatistics jobid=<id>
  rpc ListJobStatistics (ListJobstatisticsCommand) returns (ListJobStatisticsResponse);
  // list files jobid=<id>
  rpc ListFiles (ListFilesCommand) returns (ListFilesResponse);
  // list basefiles jobid=<id>
  rpc ListBaseFiles (ListBasefilesCommand) returns (ListFilesResponse);
  // list log [client=<name>] [reverse]
  rpc ListLog (ListLogCommand) returns (ListLogResponse);
  // list volumes [jobid= | ujobid= | pool= | all] [count]
  rpc ListVolumes (ListVolumesCommand) returns (ListVolumesResponse);
  // list media [...] (gleichbedeutend mit list volumes)
  rpc ListMedia (ListVolumesCommand) returns (ListVolumesResponse);
  // list volume=<name> | volumeid=<id> | mediaid=<id> | media=<name>
  rpc GetVolume (ListVolumeCommand) returns (GetVolumeResponse);
  // list pools | list pool=<name> | list poolid=<id>
  rpc ListPools (ListPoolsCommand) returns (ListPoolsResponse);
  // list clients | list client=<name>
  rpc ListClients (ListClientsCommand) returns (ListClientsResponse);
  // list filesets | list fileset [filesetid= | jobid= | ujobid=]
  rpc ListFilesets (ListFilesetsCommand) returns (ListFilesetsResponse);
  // list storages
  rpc ListStorages (ListStoragesCommand) returns (ListStoragesResponse);
  // list nextvolume job=<name> [days=<n>]
  rpc ListNextVolume (ListNextvolumeCommand) returns (NextVolumeResponse);

  // ------------------------------------------------------------------------
  // status / .status (lesend, implementiert)
  // ------------------------------------------------------------------------

  // status dir [days=<n>] [header] [running] [terminated]
  rpc GetDirectorStatus (bareos.director.commands.StatusCommand) returns (DirectorStatusResponse);
  // status all
  rpc GetStatusAll (bareos.director.commands.StatusCommand) returns (DirectorStatusResponse);
  // status scheduler [schedule=] [client=] [job=] [days=] | status schedule=<name>
  rpc GetSchedulerStatus (StatusSchedulerCommand) returns (SchedulerStatusResponse);
  // status client=<name>
  rpc GetClientStatus (bareos.director.commands.StatusCommand) returns (ClientStatusResponse);
  // status storage=<name> [slots]
  rpc GetStorageStatus (StatusStorageCommand) returns (StorageStatusResponse);
  // status subscriptions [clients] [plugins] [all] [anonymize] [client=]
  rpc GetSubscriptions (StatusSubscriptionsCommand) returns (SubscriptionsResponse);
  // status configuration
  rpc GetConfigurationStatus (bareos.director.commands.StatusCommand) returns (TextResponse);
  // status job=<name>
  rpc GetJobStatus (StatusJobCommand) returns (TextResponse);
  // .status dir (current | last | header | scheduled | running | terminated)
  rpc DotStatusDirector (DotStatusDirCommand) returns (DirectorStatusResponse);
  // .status client=<name> [header | running | terminated]
  rpc DotStatusClient (DotStatusClientCommand) returns (ClientStatusResponse);
  // .status storage=<name> [header | waitreservation | devices | volumes | spooling | running | terminated]
  rpc DotStatusStorage (DotStatusStorageCommand) returns (StorageStatusResponse);

  // ------------------------------------------------------------------------
  // show (lesend, implementiert). Ohne Namen: alle Ressourcen des Typs.
  // ------------------------------------------------------------------------

  rpc ShowCatalogs (bareos.director.commands.ShowCommand) returns (ShowResponse);
  rpc ShowClients (bareos.director.commands.ShowCommand) returns (ShowResponse);
  rpc ShowConsoles (bareos.director.commands.ShowCommand) returns (ShowResponse);
  rpc ShowDirectors (bareos.director.commands.ShowCommand) returns (ShowResponse);
  rpc ShowFilesets (bareos.director.commands.ShowCommand) returns (ShowResponse);
  rpc ShowJobdefs (bareos.director.commands.ShowCommand) returns (ShowResponse);
  rpc ShowJobs (bareos.director.commands.ShowCommand) returns (ShowResponse);
  rpc ShowMessages (bareos.director.commands.ShowCommand) returns (ShowResponse);
  rpc ShowPools (bareos.director.commands.ShowCommand) returns (ShowResponse);
  rpc ShowProfiles (bareos.director.commands.ShowCommand) returns (ShowResponse);
  rpc ShowSchedules (bareos.director.commands.ShowCommand) returns (ShowResponse);
  rpc ShowStorages (bareos.director.commands.ShowCommand) returns (ShowResponse);
  // show users | show user=<name>
  rpc ShowUsers (ShowUserCommand) returns (ShowResponse);
  // show counters | show counter=<name>
  rpc ShowCounters (ShowCounterCommand) returns (ShowResponse);
  // show all [verbose]
  rpc ShowAll (ShowAllCommand) returns (ShowResponse);
  // show disabled [clients | jobs | schedules]
  rpc ShowDisabled (ShowDisabledCommand) returns (ShowDisabledResponse);

  // ------------------------------------------------------------------------
  // Punkt-Befehle: Auflistungen (lesend, implementiert)
  // ------------------------------------------------------------------------

  rpc DotJobs (bareos.director.commands.DotJobsCommand) returns (NameListResponse);
  rpc DotJobdefs (bareos.director.commands.DotJobdefsCommand) returns (NameListResponse);
  rpc DotClients (bareos.director.commands.DotClientsCommand) returns (NameListResponse);
  rpc DotPools (bareos.director.commands.DotPoolsCommand) returns (NameListResponse);
  // .storages (auch fuer den Onesimus-Alias .storage)
  rpc DotStorages (bareos.director.commands.DotStoragesCommand) returns (NameListResponse);
  rpc DotFilesets (bareos.director.commands.DotFilesetsCommand) returns (NameListResponse);
  rpc DotCatalogs (bareos.director.commands.DotCatalogsCommand) returns (NameListResponse);
  rpc DotConsoles (bareos.director.commands.DotConsolesCommand) returns (NameListResponse);
  rpc DotUsers (bareos.director.commands.DotUsersCommand) returns (NameListResponse);
  rpc DotSchedule (bareos.director.commands.DotScheduleCommand) returns (NameListResponse);
  rpc DotMsgs (bareos.director.commands.DotMsgsCommand) returns (NameListResponse);
  rpc DotProfiles (bareos.director.commands.DotProfilesCommand) returns (NameListResponse);
  rpc DotTypes (bareos.director.commands.DotTypesCommand) returns (NameListResponse);
  rpc DotVolstatus (bareos.director.commands.DotVolstatusCommand) returns (NameListResponse);
  rpc DotActiononpurge (bareos.director.commands.DotActiononpurgeCommand) returns (NameListResponse);
  rpc DotMedia (bareos.director.commands.DotMediaCommand) returns (NameListResponse);
  rpc DotMediatypes (bareos.director.commands.DotMediatypesCommand) returns (NameListResponse);
  rpc DotLocations (bareos.director.commands.DotLocationsCommand) returns (NameListResponse);
  rpc DotLevels (bareos.director.commands.DotLevelsCommand) returns (LevelListResponse);
  rpc DotJobstatus (bareos.director.commands.DotJobstatusCommand) returns (JobStatusListResponse);
  rpc DotDefaults (bareos.director.commands.DotDefaultsCommand) returns (DefaultsResponse);
  rpc DotAuthorized (bareos.director.commands.DotAuthorizedCommand) returns (AuthorizedResponse);
  rpc DotSqlTables (bareos.director.commands.DotSqlTablesCommand) returns (SqlTablesResponse);
  rpc DotSqlCount (bareos.director.commands.DotSqlCountCommand) returns (SqlTablesResponse);
  rpc DotSqlSchema (bareos.director.commands.DotSqlSchemaCommand) returns (SqlSchemaResponse);
  // .acl [list] [console=<name>]
  rpc DotAclList (bareos.director.commands.DotAclListCommand) returns (AclListResponse);
  // .profile [list]
  rpc DotProfileList (bareos.director.commands.DotProfileListCommand) returns (NameListResponse);

  // ------------------------------------------------------------------------
  // BVFS / OVFS (lesend, implementiert)
  // ------------------------------------------------------------------------

  rpc DotBvfsGetJobids (bareos.director.commands.DotBvfsGetJobidsCommand) returns (BvfsJobIdsResponse);
  rpc DotBvfsLsdirs (bareos.director.commands.DotBvfsLsdirsCommand) returns (BvfsListResponse);
  rpc DotBvfsLsfiles (bareos.director.commands.DotBvfsLsfilesCommand) returns (BvfsListResponse);
  // .bvfs_versions jobid=0 client= pathid= filename= (jobid=0 setzt der Director)
  rpc DotBvfsVersions (bareos.director.commands.DotBvfsVersionsCommand) returns (BvfsListResponse);
  rpc DotOvfsStatus (DotOvfsStatusCommand) returns (OvfsStatusResponse);
  rpc DotOvfsLatest (DotOvfsLatestCommand) returns (OvfsLatestResponse);
  rpc DotOvfsTree (DotOvfsTreeCommand) returns (OvfsTreeResponse);
  rpc DotOvfsLs (DotOvfsLsCommand) returns (OvfsLsResponse);
  rpc DotOvfsVersions (DotOvfsVersionsCommand) returns (OvfsVersionsResponse);

  // ------------------------------------------------------------------------
  // Schreibende Befehle (S-35): nur im Entwicklungs-Build des Directors
  // implementiert (Cargo-Feature grpc-development), im Produktions-Build
  // UNIMPLEMENTED. Jede RPC fuehrt genau eine nicht interaktive
  // Konsolenzeile aus ("... yes" wo der Befehl es kennt); Rueckfragen werden
  // nur beantwortet, wo die RPC es beschreibt, sonst abgebrochen
  // (ActionResponse.question). Zerstoerende RPCs (Relabel, Prune*, Purge*,
  // Delete*, Truncate) verlangen confirm = true, sonst INVALID_ARGUMENT.
  // ------------------------------------------------------------------------

  rpc Run (RunJobCommand) returns (ActionResponse);
  rpc Rerun (RerunJobCommand) returns (ActionResponse);
  rpc Cancel (bareos.director.commands.CancelCommand) returns (ActionResponse);
  // restore ... (nicht interaktiv: Auswahl ueber die Parameter, siehe auch
  // StartRestoreSession)
  rpc Restore (RestoreJobCommand) returns (ActionResponse);
  rpc Label (LabelVolumeCommand) returns (ActionResponse);
  rpc Relabel (RelabelVolumeCommand) returns (ActionResponse);
  rpc Mount (bareos.director.commands.MountCommand) returns (ActionResponse);
  // unmount / umount
  rpc Unmount (bareos.director.commands.UnmountCommand) returns (ActionResponse);
  rpc Release (bareos.director.commands.ReleaseCommand) returns (ActionResponse);
  rpc AddVolumes (bareos.director.commands.AddCommand) returns (ActionResponse);
  rpc CreatePool (bareos.director.commands.CreateCommand) returns (ActionResponse);
  // delete volume=<name> [pool=<name>]
  rpc DeleteVolume (DeleteObjectCommand) returns (ActionResponse);
  // delete pool=<name>
  rpc DeletePool (DeleteObjectCommand) returns (ActionResponse);
  // delete jobid=<ids>
  rpc DeleteJob (DeleteObjectCommand) returns (ActionResponse);
  // delete storage storage=<name>
  rpc DeleteStorage (DeleteObjectCommand) returns (ActionResponse);
  rpc Enable (bareos.director.commands.EnableCommand) returns (ActionResponse);
  rpc Disable (bareos.director.commands.DisableCommand) returns (ActionResponse);
  rpc ExportVolumes (bareos.director.commands.ExportCommand) returns (ActionResponse);
  rpc ImportVolumes (bareos.director.commands.ImportCommand) returns (ActionResponse);
  rpc MoveVolumes (bareos.director.commands.MoveCommand) returns (ActionResponse);
  // prune files [client=] [pool=]
  rpc PruneFiles (PruneTargetCommand) returns (ActionResponse);
  // prune jobs [client=] [pool=]
  rpc PruneJobs (PruneTargetCommand) returns (ActionResponse);
  // prune volume [=<name>] [all] [pool=]
  rpc PruneVolume (PruneVolumeCommand) returns (ActionResponse);
  // prune stats
  rpc PruneStats (PruneTargetCommand) returns (ActionResponse);
  // prune directory [=<dir>] [client=] [recursive]
  rpc PruneDirectory (PruneDirectoryCommand) returns (ActionResponse);
  // purge files [job= | jobid= | client= | volume=]
  rpc PurgeFiles (PurgeTargetCommand) returns (ActionResponse);
  // purge jobs [client= | volume= | pool=] [jobstatus=]
  rpc PurgeJobs (PurgeTargetCommand) returns (ActionResponse);
  // purge volume[=<name>] [storage=] [pool=] [devicetype=] [drive=] [action=]
  rpc PurgeVolume (PurgeTargetCommand) returns (ActionResponse);
  // purge quota [client=]
  rpc PurgeQuota (PurgeTargetCommand) returns (ActionResponse);
  // update volume=<name> ...
  rpc UpdateVolume (UpdateVolumeCommand) returns (ActionResponse);
  // update pool=<name> ...
  rpc UpdatePool (bareos.director.commands.UpdateCommand) returns (ActionResponse);
  // update slots [storage=] [scan] [drive=]
  rpc UpdateSlots (UpdateSlotsCommand) returns (ActionResponse);
  // update jobid=<id> ...
  rpc UpdateJob (bareos.director.commands.UpdateCommand) returns (ActionResponse);
  // update stats [days=]
  rpc UpdateStats (bareos.director.commands.UpdateCommand) returns (ActionResponse);
  rpc Truncate (TruncateVolumesCommand) returns (ActionResponse);
  // configure add <resource-type> name=<name> <directives>
  rpc ConfigureAdd (bareos.director.commands.ConfigureAddCommand) returns (ActionResponse);
  // configure export client=<name>
  rpc ConfigureExport (bareos.director.commands.ConfigureExportCommand) returns (ActionResponse);
  rpc ConfigureDelete (bareos.director.commands.ConfigureDeleteCommand) returns (ActionResponse);
  rpc ConfigureUpdate (bareos.director.commands.ConfigureUpdateCommand) returns (ActionResponse);
  rpc Reload (bareos.director.commands.ReloadCommand) returns (ActionResponse);
  rpc SetDebug (SetDebugLevelCommand) returns (ActionResponse);
  rpc SetBandwidth (bareos.director.commands.SetbandwidthCommand) returns (ActionResponse);
  rpc SetDevice (bareos.director.commands.SetdeviceCommand) returns (ActionResponse);
  rpc SetIp (bareos.director.commands.SetipCommand) returns (ActionResponse);
  rpc Trace (TraceSwitchCommand) returns (ActionResponse);
  // .sql query=<sql> (kann schreiben, daher hier)
  rpc DotSql (bareos.director.commands.DotSqlCommand) returns (SqlQueryResponse);
  // sqlquery <sql> (interaktiv in der Konsole)
  rpc SqlQuery (bareos.director.commands.SqlQueryCommand) returns (SqlQueryResponse);
  // query: vordefinierte Abfrage <number> mit Parametern
  rpc Query (QueryRunCommand) returns (SqlQueryResponse);
  rpc DotBvfsUpdate (bareos.director.commands.DotBvfsUpdateCommand) returns (ActionResponse);
  rpc DotBvfsRestore (bareos.director.commands.DotBvfsRestoreCommand) returns (ActionResponse);
  rpc DotBvfsCleanup (bareos.director.commands.DotBvfsCleanupCommand) returns (ActionResponse);
  rpc DotBvfsClearCache (bareos.director.commands.DotBvfsClearCacheCommand) returns (ActionResponse);
  rpc DotAclSet (bareos.director.commands.DotAclSetCommand) returns (ActionResponse);
  rpc DotAclDelete (bareos.director.commands.DotAclDeleteCommand) returns (ActionResponse);
  rpc DotAclClear (bareos.director.commands.DotAclClearCommand) returns (ActionResponse);
  rpc DotAclCopy (bareos.director.commands.DotAclCopyCommand) returns (ActionResponse);
  rpc DotProfileCreate (bareos.director.commands.DotProfileCreateCommand) returns (ActionResponse);
  rpc DotProfileSet (bareos.director.commands.DotProfileSetCommand) returns (ActionResponse);
  rpc DotProfileDelete (bareos.director.commands.DotProfileDeleteCommand) returns (ActionResponse);
  rpc DotProfileAssign (bareos.director.commands.DotProfileAssignCommand) returns (ActionResponse);
  rpc DotProfileUnassign (bareos.director.commands.DotProfileUnassignCommand) returns (ActionResponse);

  // ------------------------------------------------------------------------
  // Sitzungsbefehle (S-35, Entwicklungs-Build). Sie wirken auf die Sitzung
  // des Session-Tokens. Nicht anwendbar (FAILED_PRECONDITION): Gui, DotApi,
  // DotGrpc (das Antwortformat legt die RPC fest) und SetIp (keine
  // Konsolenadresse im gRPC-Pfad).
  // ------------------------------------------------------------------------

  // use catalog=<name>
  rpc UseCatalog (bareos.director.commands.UseCommand) returns (ActionResponse);
  // wait [jobid= | jobname= | ujobid= | mount] [timeout=]
  rpc Wait (bareos.director.commands.WaitCommand) returns (ActionResponse);
  rpc Gui (GuiSwitchCommand) returns (ActionResponse);
  rpc Autodisplay (AutodisplaySwitchCommand) returns (ActionResponse);
  rpc Automount (AutomountSwitchCommand) returns (ActionResponse);
  // .api <mode> [compact=]
  rpc DotApi (DotApiModeCommand) returns (ActionResponse);
  rpc DotGrpc (bareos.director.commands.DotGrpcCommand) returns (ActionResponse);
  // quit / exit / .quit: beendet die Sitzung (Session-Token wird ungueltig)
  rpc Quit (bareos.director.commands.QuitCommand) returns (ActionResponse);
  rpc Exit (bareos.director.commands.ExitCommand) returns (ActionResponse);
  rpc DotQuit (bareos.director.commands.DotQuitCommand) returns (ActionResponse);

  // ------------------------------------------------------------------------
  // Interaktive Wiederherstellung: Dateiauswahl im Restore-Baum (S-35,
  // Entwicklungs-Build). StartRestoreSession baut den Baum auf, die
  // RestoreTree*-RPCs entsprechen den Befehlen der Dateiauswahl
  // (ua_tree.cc), RestoreTreeDone startet den Restore-Job. Die Sitzung
  // gehoert zum Session-Token; ohne Aufruf endet sie nach 10 Minuten.
  // ------------------------------------------------------------------------

  rpc StartRestoreSession (RestoreSessionCommand) returns (RestoreSessionResponse);
  // cd <dir>
  rpc RestoreTreeCd (RestoreTreePathCommand) returns (RestoreTreeListResponse);
  // ls / .ls / dir / .dir [pattern]
  rpc RestoreTreeLs (RestoreTreePathCommand) returns (RestoreTreeListResponse);
  // .lsdir [pattern]: nur Verzeichnisse
  rpc RestoreTreeLsDir (RestoreTreePathCommand) returns (RestoreTreeListResponse);
  // lsmark / .lsmark [pattern]: nur markierte Eintraege
  rpc RestoreTreeLsMark (RestoreTreePathCommand) returns (RestoreTreeListResponse);
  // pwd / .pwd
  rpc RestoreTreePwd (RestoreTreeSessionCommand) returns (RestoreTreeListResponse);
  // mark / add <pattern>
  rpc RestoreTreeMark (RestoreTreePathCommand) returns (RestoreTreeCountResponse);
  // unmark / delete <pattern>
  rpc RestoreTreeUnmark (RestoreTreePathCommand) returns (RestoreTreeCountResponse);
  // markdir <pattern>
  rpc RestoreTreeMarkDir (RestoreTreePathCommand) returns (RestoreTreeCountResponse);
  // unmarkdir <pattern>
  rpc RestoreTreeUnmarkDir (RestoreTreePathCommand) returns (RestoreTreeCountResponse);
  // count
  rpc RestoreTreeCount (RestoreTreeSessionCommand) returns (RestoreTreeCountResponse);
  // find <pattern>
  rpc RestoreTreeFind (RestoreTreePathCommand) returns (RestoreTreeListResponse);
  // estimate
  rpc RestoreTreeEstimate (RestoreTreeSessionCommand) returns (RestoreTreeCountResponse);
  // help / .help / ?
  rpc RestoreTreeHelp (RestoreTreeSessionCommand) returns (HelpResponse);
  // done / exit: Auswahl abschliessen, Restore-Job starten
  rpc RestoreTreeDone (RestoreTreeSessionCommand) returns (ActionResponse);
  // abort / quit: Auswahl verwerfen
  rpc RestoreTreeAbort (RestoreTreeSessionCommand) returns (ActionResponse);
}

// ==========================================================================
// Enums
// ==========================================================================

// Job-Status (Job.JobStatus). Zahlenwert = ASCII-Code des Katalogzeichens.
enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;
  JOB_STATUS_CANCELED = 65;                 // 'A' Canceled by user
  JOB_STATUS_BLOCKED = 66;                  // 'B' Blocked
  JOB_STATUS_CREATED = 67;                  // 'C' Created, not yet running
  JOB_STATUS_DIFFERENCES = 68;              // 'D' Verify found differences
  JOB_STATUS_ERROR_TERMINATED = 69;         // 'E' Terminated with errors
  JOB_STATUS_WAIT_FD = 70;                  // 'F' Waiting for Client
  JOB_STATUS_INCOMPLETE = 73;               // 'I' Incomplete job
  JOB_STATUS_DATA_COMMITTING = 76;          // 'L' Committing data
  JOB_STATUS_WAIT_MOUNT = 77;               // 'M' Waiting for media mount
  JOB_STATUS_RUNNING = 82;                  // 'R' Running
  JOB_STATUS_WAIT_SD = 83;                  // 'S' Waiting for Storage daemon
  JOB_STATUS_TERMINATED = 84;               // 'T' Completed successfully
  JOB_STATUS_WARNINGS = 87;                 // 'W' Terminated with warnings
  JOB_STATUS_ATTR_DESPOOLING = 97;          // 'a' SD despooling attributes
  JOB_STATUS_WAIT_CLIENT_RES = 99;          // 'c' Waiting for client resource
  JOB_STATUS_WAIT_MAX_JOBS = 100;           // 'd' Waiting on maximum jobs
  JOB_STATUS_ERROR = 101;                   // 'e' Non-fatal error
  JOB_STATUS_FATAL_ERROR = 102;             // 'f' Fatal error
  JOB_STATUS_ATTR_INSERTING = 105;          // 'i' Doing batch insert file records
  JOB_STATUS_WAIT_JOB_RES = 106;            // 'j' Waiting for job resource
  JOB_STATUS_DATA_DESPOOLING = 108;         // 'l' Doing data despooling
  JOB_STATUS_WAIT_MEDIA = 109;              // 'm' Waiting for new media
  JOB_STATUS_WAIT_PRIORITY = 112;           // 'p' Waiting on higher priority jobs
  JOB_STATUS_WAIT_DEVICE = 113;             // 'q' Queued waiting for device
  JOB_STATUS_WAIT_STORE_RES = 115;          // 's' Waiting for storage resource
  JOB_STATUS_WAIT_START_TIME = 116;         // 't' Waiting on start time
}

// Job-Typ (Job.Type). Zahlenwert = ASCII-Code des Katalogzeichens; die
// Langform des Directors ("Backup", "Job Copy" ...) wird ebenfalls erkannt.
enum JobType {
  JOB_TYPE_UNSPECIFIED = 0;
  JOB_TYPE_ARCHIVE = 65;                    // 'A'
  JOB_TYPE_BACKUP = 66;                     // 'B'
  JOB_TYPE_JOB_COPY = 67;                   // 'C' Kopie (Kopierziel)
  JOB_TYPE_ADMIN = 68;                      // 'D'
  JOB_TYPE_SYSTEM = 73;                     // 'I'
  JOB_TYPE_MIGRATED_JOB = 77;               // 'M'
  JOB_TYPE_CONSOLIDATE = 79;                // 'O'
  JOB_TYPE_RESTORE = 82;                    // 'R'
  JOB_TYPE_SCAN = 83;                       // 'S'
  JOB_TYPE_CONSOLE = 85;                    // 'U'
  JOB_TYPE_VERIFY = 86;                     // 'V'
  JOB_TYPE_COPY = 99;                       // 'c' Copy-Job
  JOB_TYPE_MIGRATE = 103;                   // 'g'
}

// Job-Level (Job.Level). Zahlenwert = ASCII-Code des Katalogzeichens; die
// Langform ("Full", "VolumeToCatalog" ...) wird ebenfalls erkannt.
enum JobLevel {
  JOB_LEVEL_UNSPECIFIED = 0;
  JOB_LEVEL_NONE = 32;                      // ' ' (Admin-, Restore-Jobs)
  JOB_LEVEL_DATA = 65;                      // 'A'
  JOB_LEVEL_BASE = 66;                      // 'B'
  JOB_LEVEL_CATALOG = 67;                   // 'C'
  JOB_LEVEL_DIFFERENTIAL = 68;              // 'D'
  JOB_LEVEL_FULL = 70;                      // 'F'
  JOB_LEVEL_INCREMENTAL = 73;               // 'I'
  JOB_LEVEL_VOLUME_TO_CATALOG = 79;         // 'O'
  JOB_LEVEL_SINCE = 83;                     // 'S'
  JOB_LEVEL_INIT_CATALOG = 86;              // 'V'
  JOB_LEVEL_DISK_TO_CATALOG = 100;          // 'd'
  JOB_LEVEL_VIRTUAL_FULL = 102;             // 'f'
}

// Volume-Status (Media.VolStatus); erkannt am Namen ("Append", "Read-Only" ...)
enum VolumeStatus {
  VOLUME_STATUS_UNSPECIFIED = 0;
  VOLUME_STATUS_APPEND = 1;
  VOLUME_STATUS_FULL = 2;
  VOLUME_STATUS_USED = 3;
  VOLUME_STATUS_RECYCLE = 4;
  VOLUME_STATUS_PURGED = 5;
  VOLUME_STATUS_ERROR = 6;
  VOLUME_STATUS_BUSY = 7;
  VOLUME_STATUS_CLEANING = 8;
  VOLUME_STATUS_ARCHIVE = 9;
  VOLUME_STATUS_READ_ONLY = 10;
  VOLUME_STATUS_DISABLED = 11;
  VOLUME_STATUS_UNLABELED = 12;
}

