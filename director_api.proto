  option (bareos.usage) = ".api [ 0 | 1 | 2 | off | on | json ] [compact=<yes|no>]";

  string mode = 1;     // positional
  string compact = 2;
}

// query: vordefinierte Abfrage aus der QueryFile
message QueryRunCommand {
  option (bareos.command_name) = "query";
  option (bareos.help_text) = "Query catalog";
  option (bareos.audit_event) = true;

  uint32 number = 1 [(bareos.required) = true];  // Nummer der Abfrage
  repeated string parameters = 2;                // Antworten auf die Rueckfragen
}

// Dateiauswahl einer Restore-Sitzung ohne Pfad (pwd, count, estimate,
// help, done, abort)
message RestoreTreeSessionCommand {
  option (bareos.command_name) = "restore tree";
  option (bareos.help_text) = "Restore file selection command";

  string session_id = 1 [(bareos.required) = true];  // aus StartRestoreSession
}

// Dateiauswahl einer Restore-Sitzung mit Pfad/Muster (cd, ls, mark, find ...)
message RestoreTreePathCommand {
  option (bareos.command_name) = "restore tree";
  option (bareos.help_text) = "Restore file selection command";

  string session_id = 1 [(bareos.required) = true];
  string path = 2;  // Verzeichnis oder Muster (Wildcards erlaubt)
}

// ==========================================================================
// Requests der schreibenden RPCs (S-35), wo die Messages aus
// director_commands.proto Parameter nicht kennen (yes, confirm, Listen ...)
// ==========================================================================

// run job=<name> ... yes
message RunJobCommand {
  option (bareos.command_name) = "run";
  option (bareos.help_text) = "Run a job";
  option (bareos.usage) = "run job=<job-name> [level=] [client=] [fileset=] [pool=] [nextpool=] "
                          "[storage=] [when=] [since=] [priority=] [jobid=] [spooldata=] "
                          "[accurate=] [comment=] [catalog=] [pluginoptions=] yes";
  option (bareos.audit_event) = true;

  string job = 1 [(bareos.required) = true];
  string level = 2;            // Full, Incremental, Differential, VirtualFull ...
  string client = 3;
  string fileset = 4;
  string pool = 5;
  string nextpool = 6;
  string storage = 7;
  string when = 8;             // "YYYY-MM-DD HH:MM:SS"
  string since = 9;
  uint32 priority = 10;
  uint32 jobid = 11;           // Verify/Migration: Bezugsjob
  optional bool spooldata = 12;
  optional bool accurate = 13;
  string comment = 14;
  string catalog = 15;
  string pluginoptions = 16;
}

// rerun jobid=<ids> | since_jobid= [until_jobid=] | days= / hours= ... yes
message RerunJobCommand {
  option (bareos.command_name) = "rerun";
  option (bareos.help_text) = "Rerun a job";
  option (bareos.usage) = "rerun jobid=<jobid> | since_jobid=<jobid> [ until_jobid=<jobid> ] | "
                          "days=<nr_days> | hours=<nr_hours> yes";
  option (bareos.audit_event) = true;

  repeated uint32 jobid = 1;
  uint32 since_jobid = 2;
  uint32 until_jobid = 3;
  uint32 days = 4;
  uint32 hours = 5;
}

// restore ... (nicht interaktiv: "all" oder file=/directory=/fileregex=,
// dann "done ... yes")
message RestoreJobCommand {
  option (bareos.command_name) = "restore";
  option (bareos.help_text) = "Restore files";
  option (bareos.usage) = "restore client=<client-name> (jobid=<ids> | [fileset=] [before=] select current) "
                          "(all | file=<path> ... | directory=<dir/> ... | fileregex=<regex>) "
                          "[where= | regexwhere= | strip_prefix= add_prefix= add_suffix=] "
                          "[replace=] [restoreclient=] [restorejob=] [storage=] [comment=] done yes";
  option (bareos.audit_event) = true;

  string client = 1 [(bareos.required) = true];
  repeated uint32 jobid = 2;   // leer: juengster Stand (select current) bzw. before
  string fileset = 3;
  string pool = 4;
  string before = 5;           // "YYYY-MM-DD HH:MM:SS"
  bool all = 6;                // alle Dateien
  repeated string file = 7;    // volle Pfade
  repeated string directory = 8;  // mit "/" am Ende, nur mit jobid
  string fileregex = 9;
  string where = 10;
  string regexwhere = 11;
  string strip_prefix = 12;
  string add_prefix = 13;
  string add_suffix = 14;
  string replace = 15;         // always, ifnewer, ifolder, never
  string restoreclient = 16;
  string restorejob = 17;
  string storage = 18;
  string comment = 19;
  string pluginoptions = 20;
}

// restore ... bis zur Dateiauswahl (StartRestoreSession); die Auswahl
// folgt mit den RestoreTree*-RPCs
message RestoreSessionCommand {
  option (bareos.command_name) = "restore";
  option (bareos.help_text) = "Restore files, interactive file selection";
  option (bareos.usage) = "restore client=<client-name> (jobid=<ids> | [fileset=] [before=] select current) "
                          "[where=] [replace=] [restoreclient=] [restorejob=] [storage=] [comment=]";
  option (bareos.audit_event) = true;

  string client = 1 [(bareos.required) = true];
  repeated uint32 jobid = 2;
  string fileset = 3;
  string pool = 4;
  string before = 5;
  string where = 6;
  string regexwhere = 7;
  string strip_prefix = 8;
  string add_prefix = 9;
  string add_suffix = 10;
  string replace = 11;
  string restoreclient = 12;
  string restorejob = 13;
  string storage = 14;
  string comment = 15;
  string pluginoptions = 16;
}

// label storage= volume= pool= [slot=] [drive=] [encrypt] [barcodes] yes
message LabelVolumeCommand {
  option (bareos.command_name) = "label";
  option (bareos.help_text) = "Label a tape";
  option (bareos.usage) = "label storage=<storage-name> volume=<volume-name> pool=<pool-name> "
                          "[slot=<slot>] [drive=<drivenum>] [encrypt] [barcodes] yes";
  option (bareos.audit_event) = true;

  string storage = 1 [(bareos.required) = true];
  string volume = 2;           // Pflicht ausser bei barcodes
  string pool = 3 [(bareos.required) = true];
  uint32 slot = 4;
  uint32 drive = 5;
  bool encrypt = 6   [(bareos.bare_flag) = true];
  bool barcodes = 7  [(bareos.bare_flag) = true];
}

// relabel storage= oldvolume= volume= [pool=] ... yes (zerstoerend)
message RelabelVolumeCommand {
  option (bareos.command_name) = "relabel";
  option (bareos.help_text) = "Relabel a tape";
  option (bareos.usage) = "relabel storage=<storage-name> oldvolume=<old-volume-name> "
                          "volume=<new-volume-name> [pool=<pool-name>] [slot=] [drive=] [encrypt] yes";
  option (bareos.audit_event) = true;

  string storage = 1 [(bareos.required) = true];
  string oldvolume = 2 [(bareos.required) = true];
  string volume = 3 [(bareos.required) = true];
  string pool = 4;
  uint32 slot = 5;
  uint32 drive = 6;
  bool encrypt = 7 [(bareos.bare_flag) = true];
  bool confirm = 8;  // muss true sein (zerstoerend)
}

// delete volume=<name> [pool=] | pool=<name> | jobid=<ids> | storage=<name>
// (zerstoerend; die Rueckfrage "Are you sure you want to delete" wird mit
// yes beantwortet)
message DeleteObjectCommand {
  option (bareos.command_name) = "delete";
  option (bareos.help_text) = "Delete volume, pool or job";
  option (bareos.usage) = "delete volume=<vol-name> [pool=<pool-name>] | pool=<pool-name> | "
                          "jobid=<jobid1,jobid2,...> | storage=<storage-name>";
  option (bareos.allowed_in_runscript) = true;
  option (bareos.audit_event) = true;

  string volume = 1;           // DeleteVolume
  string pool = 2;             // DeletePool; bei DeleteVolume: Pool des Volumes
  repeated uint32 jobid = 3;   // DeleteJob
  string storage = 4;          // DeleteStorage
  bool confirm = 5;            // muss true sein (zerstoerend)
}

// prune files|jobs [client=] [pool=] yes, prune stats yes (zerstoerend)
message PruneTargetCommand {
  option (bareos.command_name) = "prune";
  option (bareos.help_text) = "Prune records from catalog";
  option (bareos.usage) = "prune files [client=<client>] [pool=<pool>] yes | "
                          "jobs [client=<client>] [pool=<pool>] yes | stats yes";
  option (bareos.allowed_in_runscript) = true;
  option (bareos.audit_event) = true;

  string client = 1;
  string pool = 2;
  bool confirm = 3;  // muss true sein (zerstoerend)
}

// purge files|jobs|volume|quota ... (zerstoerend; "Purge (yes/no)?" wird
// mit yes beantwortet)
message PurgeTargetCommand {
  option (bareos.command_name) = "purge";
  option (bareos.help_text) = "Purge records from catalog";
  option (bareos.usage) = "purge files [job= | jobid= | client= | volume=] | "
                          "jobs [client= | volume= | pool=] [jobstatus=] | "
                          "volume[=<volume>] [action=<action>] [storage=] [pool= | allpools] [drive=] | "
                          "quota [client=]";
  option (bareos.allowed_in_runscript) = true;
  option (bareos.audit_event) = true;

  repeated string volume = 1;  // PurgeVolume: mehrere erlaubt
  uint32 jobid = 2;
  string job = 3;
  string client = 4;
  string pool = 5;
  string jobstatus = 6;        // Statuszeichen, durch Komma getrennt
  string action = 7;           // PurgeVolume: truncate | all
  string storage = 8;
  bool allpools = 9  [(bareos.bare_flag) = true];
  uint32 drive = 10;
  string devicetype = 11;
  bool confirm = 12;           // muss true sein (zerstoerend)
}

// update volume=<name> <eigenschaften> | update volume allfrompool=<pool>
// | update volume fromallpools
message UpdateVolumeCommand {
  option (bareos.command_name) = "update volume";
  option (bareos.help_text) = "Update volume records";
  option (bareos.usage) = "update volume=<volume-name> [volstatus=] [volretention=] [voluse=] "
                          "[maxvolbytes=] [maxvoljobs=] [maxvolfiles=] [slot=] [recycle=] "
                          "[inchanger=] [enabled=] [actiononpurge=] [pool=] [recyclepool=] "
                          "[storage=] [frompool] [encrypt=] | allfrompool=<pool> | fromallpools";
  option (bareos.allowed_in_runscript) = true;
  option (bareos.audit_event) = true;

  string volume = 1;
  string allfrompool = 2;
  bool fromallpools = 3  [(bareos.bare_flag) = true];
  string volstatus = 4;        // Append, Full, Used, Recycle, Purged, Error, Archive, Read-Only, Disabled
  string volretention = 5;     // Zeitangabe, z.B. "30 days"
  string voluse = 6;
  string maxvolbytes = 7;      // Groesse, z.B. "10 g"
  optional uint32 maxvoljobs = 8;
  optional uint32 maxvolfiles = 9;
  optional uint32 slot = 10;
  optional bool recycle = 11;
  optional bool inchanger = 12;
  string enabled = 13;         // yes, no, archived
  string actiononpurge = 14;   // none, truncate
  string pool = 15;
  string recyclepool = 16;
  string storage = 17;
  bool frompool = 18;          // Werte aus der Pool-Ressource
  string encrypt = 19;         // yes, no, rotate
}

// truncate volstatus=Purged [storage=] [pool=] [volume=] [drive=] yes
// (zerstoerend)
message TruncateVolumesCommand {
  option (bareos.command_name) = "truncate";
  option (bareos.help_text) = "Truncate purged volumes";
  option (bareos.usage) = "truncate volstatus=Purged [storage=<storage>] [pool=<pool>] "
                          "[volume=<volume>] [drive=<drivenum>] yes";
  option (bareos.allowed_in_runscript) = true;
  option (bareos.audit_event) = true;

  string storage = 1;
  string pool = 2;
  string volume = 3;
  optional uint32 drive = 4;
  bool confirm = 5;  // muss true sein (zerstoerend)
}

// setdebug level=<n> [trace=0/1] [timestamp=0/1] [hangup=] dir | all |
// client=<name> | storage=<name>
message SetDebugLevelCommand {
  option (bareos.command_name) = "setdebug";
  option (bareos.help_text) = "Sets debug level";
  option (bareos.usage) = "setdebug level=<nn> [trace=0/1] [timestamp=0/1] [hangup=<n>] "
                          "dir | all | client=<client-name> | storage=<storage-name>";
  option (bareos.allowed_in_runscript) = true;
  option (bareos.audit_event) = true;

  uint32 level = 1;
  optional bool trace = 2;
  optional bool timestamp = 3;
  optional uint32 hangup = 4;
  bool dir = 5     [(bareos.bare_flag) = true];
  bool all = 6     [(bareos.bare_flag) = true];
  string client = 7;
  string storage = 8;
}

// ==========================================================================
// Gemeinsame Ergebnis-Messages
// ==========================================================================

// Paging-Angaben (JSON "meta": {"range": {...}}) bei limit/offset und
// wenn die Konsolen-ACL Zeilen ausgefiltert hat
message RangeInfo {
  uint32 limit = 1;
  optional uint32 offset = 2;
  uint64 filtered = 3;           // durch ACL ausgefilterte Zeilen
}

message MetaInfo {
  RangeInfo range = 1;
}

// Antwort fuer Befehle, die nur Text liefern (keine API-2-Struktur)
message TextResponse {
  string text = 1;               // Ausgabe wie in der Konsole
}

// Antwort der schreibenden Befehle (S-35)
message ActionResponse {
  bool success = 1;
  string text = 2;                         // Ausgabe wie in der Konsole
  repeated string errors = 3;
  repeated string warnings = 4;
  repeated uint32 jobids = 5;              // gestartete/betroffene Jobs
  google.protobuf.Struct result = 6;       // API-2-Ergebnis, falls vorhanden
  // Datensaetze nach der Aenderung (aus list jobid= / volume= / pool=)
  repeated JobInfo jobs = 7;
  repeated VolumeInfo volumes = 8;
  repeated PoolInfo pools = 9;
  string question = 10;                    // abgebrochene Rueckfrage des Directors
  string command = 11;                     // ausgefuehrte Konsolenzeile
}

// Name eines Eintrags (Punkt-Auflistungen)
message NameInfo {
  string name = 1;
  optional bool enabled = 2;     // nur bei Ressourcen mit Enabled-Status
  map<string, string> extra_fields = 100;
}

message NameListResponse {
  repeated NameInfo items = 1;
}

// ==========================================================================
// Info, Hilfe
// ==========================================================================

message VersionInfo {
  string name = 1;
  string type = 2;
  string version = 3;
  string bdate = 4;
  string operatingsystem = 5;
  string distname = 6;
  string distversion = 7;
  string customversionid = 8;
  map<string, string> extra_fields = 100;
}

message VersionResponse {
  VersionInfo version = 1;
}

message TimeInfo {
  string full = 1;               // "Sat 17-Oct-2026 17:45:28"
  uint32 year = 2;
  uint32 month = 3;
  uint32 day = 4;
  uint32 hour = 5;
  uint32 minute = 6;
  uint32 second = 7;
  map<string, string> extra_fields = 100;
}

message TimeResponse {
  TimeInfo time = 1;
}

message WhoamiResponse {
  string whoami = 1;
}

// Kopf von "status dir"
message DirectorHeaderInfo {
  string director = 1;
  string version = 2;
  string release_date = 3;
  string os = 4;
  string binary_info = 5;
  string daemon_started = 6;     // "17-Oct-26 17:45"
  uint32 jobs_run = 7;
  uint32 jobs_running = 8;
  bool config_warnings = 9;
  map<string, string> extra_fields = 100;
}

message MemoryResponse {
  DirectorHeaderInfo header = 1;
  string text = 2;
}

message NoopResponse {}

message HelpInfo {
  string command = 1;
  string description = 2;
  string arguments = 3;
  bool permission = 4;           // Befehl fuer diese Konsole erlaubt
  map<string, string> extra_fields = 100;
}

message HelpResponse {
  map<string, HelpInfo> commands = 1;  // Schluessel: Befehlsname
  string text = 2;                     // Restore-Baum: Hilfetext
}

message MessagesResponse {
  string text = 1;               // wartende Meldungen
}

// ==========================================================================
// list / llist
// ==========================================================================

// Job-Datensatz (list/llist jobs, backups, jobid). list liefert die
// Kurzform, llist alle Spalten.
message JobInfo {
  uint32 jobid = 1;
  string job = 2;                // eindeutiger Jobname
  string name = 3;
  bool purgedfiles = 4;
  JobType type = 5;
  JobLevel level = 6;
  uint32 clientid = 7;
  string client = 8;
  JobStatus jobstatus = 9;
  string schedtime = 10;
  string starttime = 11;
  string endtime = 12;
  string realendtime = 13;
  string duration = 14;          // "HH:MM:SS"
  int64 jobtdate = 15;           // unix timestamp
  uint32 volsessionid = 16;
  uint32 volsessiontime = 17;
  uint64 jobfiles = 18;
  uint64 jobbytes = 19;
  uint32 joberrors = 20;
  uint32 jobmissingfiles = 21;
  uint32 poolid = 22;
  string poolname = 23;
  uint32 priorjobid = 24;
  uint32 filesetid = 25;
  string fileset = 26;
  map<string, string> extra_fields = 100;
}

message ListJobsResponse {
  repeated JobInfo jobs = 1;
  MetaInfo meta = 2;
  optional uint64 count = 3;     // bei "count"
}

// list copies
message CopyInfo {
  uint32 jobid = 1;              // Original-Job
  string job = 2;
  uint32 copyjobid = 3;          // Kopie
  string mediatype = 4;
  map<string, string> extra_fields = 100;
}

message ListCopiesResponse {
  repeated CopyInfo copies = 1;
  MetaInfo meta = 2;
}

// Log-Eintrag (list joblog, list log)
message LogEntryInfo {
  uint32 logid = 1;
  string jobname = 2;
  string clientname = 3;
  string time = 4;
  string logtext = 5;
  map<string, string> extra_fields = 100;
}

message ListJobLogResponse {
  repeated LogEntryInfo joblog = 1;
  optional uint64 count = 2;
  MetaInfo meta = 3;
}

message ListLogResponse {
  repeated LogEntryInfo log = 1;
  MetaInfo meta = 2;
}

message JobMediaInfo {
  uint32 jobmediaid = 1;
  uint32 jobid = 2;
  uint32 mediaid = 3;
  string volumename = 4;
  uint32 firstindex = 5;
  uint32 lastindex = 6;
  uint32 startfile = 7;
  uint32 endfile = 8;
  uint64 startblock = 9;
  uint64 endblock = 10;
  map<string, string> extra_fields = 100;
}

message ListJobMediaResponse {
  repeated JobMediaInfo jobmedia = 1;
  MetaInfo meta = 2;
}

message JobTotalsInfo {
  string job = 1;                // leer in der Gesamtsumme
  uint64 jobs = 2;
  uint64 files = 3;
  uint64 bytes = 4;
  map<string, string> extra_fields = 100;
}

message ListJobTotalsResponse {
  repeated JobTotalsInfo jobs = 1;   // je Jobname
  JobTotalsInfo jobtotals = 2;       // Gesamtsumme
  MetaInfo meta = 3;
}

message JobStatisticsInfo {
  uint32 deviceid = 1;
  string sampletime = 2;
  uint32 jobid = 3;
  uint64 jobfiles = 4;
  uint64 jobbytes = 5;
  map<string, string> extra_fields = 100;
}

message ListJobStatisticsResponse {
  repeated JobStatisticsInfo jobstats = 1;
  MetaInfo meta = 2;
}

message FileNameInfo {
  string filename = 1;           // Pfad + Name
  map<string, string> extra_fields = 100;
}

message ListFilesResponse {
  repeated FileNameInfo filenames = 1;
  MetaInfo meta = 2;
}

// Volume-Datensatz (Media); list liefert die Kurzform, llist alle Spalten
message VolumeInfo {
  uint32 mediaid = 1;
  string volumename = 2;
  int32 slot = 3;
  uint32 poolid = 4;
  string pool = 5;
  string mediatype = 6;
  string firstwritten = 7;
  string lastwritten = 8;
  string labeldate = 9;
  uint32 voljobs = 10;
  uint32 volfiles = 11;
  uint32 volblocks = 12;
  uint32 volmounts = 13;
  uint64 volbytes = 14;
  uint32 volerrors = 15;
  uint32 volwrites = 16;
  uint64 volcapacitybytes = 17;
  VolumeStatus volstatus = 18;
  uint32 enabled = 19;           // 0 = nein, 1 = ja, 2 = archiviert
  bool recycle = 20;
  uint64 volretention = 21;      // Sekunden
  uint64 voluseduration = 22;    // Sekunden
  uint32 maxvoljobs = 23;
  uint32 maxvolfiles = 24;
  uint64 maxvolbytes = 25;
  bool inchanger = 26;
  uint32 endfile = 27;
  uint64 endblock = 28;
  uint32 labeltype = 29;
  uint32 storageid = 30;
  uint32 deviceid = 31;
  uint32 locationid = 32;
  uint32 recyclecount = 33;
  string initialwrite = 34;
  uint32 scratchpoolid = 35;
  string scratchpool = 36;
  uint32 recyclepoolid = 37;
  string recyclepool = 38;
  bool hasencryptionkey = 39;
  string comment = 40;
  string storage = 41;
  uint32 jobmediaid = 42;        // list volumes jobid=
  uint32 jobid = 43;             // list volumes jobid=
  map<string, string> extra_fields = 100;
}

// Volumes eines Pools
message VolumeInfoList {
  repeated VolumeInfo volumes = 1;
  optional uint64 count = 2;     // bei "count"
}

message ListVolumesResponse {
  repeated VolumeInfo volumes = 1;         // mit jobid/ujobid-Filter
  map<string, VolumeInfoList> pools = 2;   // sonst: je Poolname
  MetaInfo meta = 3;
}

message GetVolumeResponse {
  VolumeInfo volume = 1;
  MetaInfo meta = 2;
}

message PoolInfo {
  uint32 poolid = 1;
  string name = 2;
  uint32 numvols = 3;
  uint32 maxvols = 4;
  bool useonce = 5;
  bool usecatalog = 6;
  bool acceptanyvolume = 7;
  uint64 volretention = 8;
  uint64 voluseduration = 9;
  uint32 maxvoljobs = 10;
  uint64 maxvolbytes = 11;
  bool autoprune = 12;
  bool recycle = 13;
  string pooltype = 14;
  string labelformat = 15;
  bool enabled = 16;
  uint32 scratchpoolid = 17;
  uint32 recyclepoolid = 18;
  uint32 labeltype = 19;
  uint32 prunablevolumes = 20;
  uint32 prunablejobs = 21;
  uint64 prunablebytes = 22;
  string reason = 23;
  map<string, string> extra_fields = 100;
}

message ListPoolsResponse {
  repeated PoolInfo pools = 1;
  MetaInfo meta = 2;
}

message ClientInfo {
  uint32 clientid = 1;
  string name = 2;
  string uname = 3;
  bool autoprune = 4;
  uint64 fileretention = 5;      // Sekunden
  uint64 jobretention = 6;       // Sekunden
  map<string, string> extra_fields = 100;
}

message ListClientsResponse {
  repeated ClientInfo clients = 1;
  MetaInfo meta = 2;
}

message FilesetInfo {
  uint32 filesetid = 1;
  string fileset = 2;
  string md5 = 3;
  string createtime = 4;
  string filesettext = 5;
  map<string, string> extra_fields = 100;
}

message ListFilesetsResponse {
  repeated FilesetInfo filesets = 1;
  MetaInfo meta = 2;
}

message StorageInfo {
  uint32 storageid = 1;
  string name = 2;
  bool autochanger = 3;
  map<string, string> extra_fields = 100;
}

message ListStoragesResponse {
  repeated StorageInfo storages = 1;
  MetaInfo meta = 2;
}

message NextVolumeInfo {
  string job = 1;
  string pool = 2;
  string level = 3;
  string volume = 4;
}

message NextVolumeResponse {
  repeated NextVolumeInfo volumes = 1;  // aus dem Text gelesen
  string text = 2;
}

// ==========================================================================
// status
// ==========================================================================

message ScheduledJobInfo {
  string name = 1;
  JobType type = 2;
  JobLevel level = 3;
  uint32 priority = 4;
  string scheduled = 5;          // "17-Oct-26 21:00"
  string volume = 6;
  string pool = 7;
  string storage = 8;
  map<string, string> extra_fields = 100;
}

message RunningJobInfo {
  uint32 jobid = 1;
  string name = 2;               // eindeutiger Jobname
  JobLevel level = 3;
  JobType type = 4;
  string status = 5;             // Statustext
  uint64 files = 6;
  uint64 bytes = 7;
  map<string, string> extra_fields = 100;
}

message TerminatedJobInfo {
  uint32 jobid = 1;
  string name = 2;
  JobLevel level = 3;
  JobType type = 4;
  string status = 5;             // "OK", "Error" ...
  uint64 files = 6;
  uint64 bytes = 7;
  string finished = 8;
  map<string, string> extra_fields = 100;
}

message ClientConnectionInfo {
  string connecttime = 1;
  int32 protocol_version = 2;
  bool authenticated = 3;
  string name = 4;
  map<string, string> extra_fields = 100;
}

message DirectorStatusResponse {
  DirectorHeaderInfo header = 1;
  repeated ScheduledJobInfo scheduled = 2;
  repeated RunningJobInfo running = 3;
  repeated TerminatedJobInfo terminated = 4;
  repeated ClientConnectionInfo client_connection = 5;
  string text = 6;               // nur Textanteile (z.B. status all)
}

message ScheduleJobInfo {
  string name = 1;
  bool enabled = 2;
}

message ScheduleStatusInfo {
  string name = 1;
  bool enabled = 2;
  repeated ScheduleJobInfo jobs = 3;
  map<string, string> extra_fields = 100;
}

message SchedulePreviewInfo {
  string datetime = 1;           // "Sun 18-Oct-2026 12:45"
  int64 runtime = 2;             // unix timestamp
  string schedule = 3;
  JobLevel level = 4;
  uint32 priority = 5;
  string pool = 6;
  string storage = 7;
  string messages = 8;
  bool spool_data = 9;
  bool accurate = 10;
  map<string, string> extra_fields = 100;
}

message SchedulerStatusResponse {
  repeated ScheduleStatusInfo schedules = 1;
  repeated SchedulePreviewInfo preview = 2;
}

message ClientStatusResponse {
  string text = 1;               // Statusbericht des File Daemons
}

// Slot eines Autochangers (status storage=<name> slots)
message SlotInfo {
  string type = 1;               // "drive", "slot", "import_slot"
  uint32 slotnr = 2;
  string content = 3;            // "full", "empty"
  uint32 loaded = 4;
  string volname = 5;
  uint32 mr_slotnr = 6;
  string mr_volname = 7;
  uint64 mr_volbytes = 8;
  string mr_volstatus = 9;
  string mr_mediatype = 10;
  string pr_name = 11;
  int64 mr_lastwritten = 12;
  int64 mr_expire = 13;
  map<string, string> extra_fields = 100;
}

message StorageStatusResponse {
  string text = 1;               // Statusbericht des Storage Daemons
  repeated SlotInfo contents = 2;
}

message SubscriptionUnitInfo {
  string client = 1;
  string plugin = 2;
  uint64 count = 3;
  double size_gb = 4;
  map<string, string> extra_fields = 100;
}

message SubscriptionSummaryInfo {
  string accounting_mode = 1;
  int64 used = 2;
  int64 configured = 3;
  int64 remaining = 4;
  map<string, string> extra_fields = 100;
}

message SubscriptionsResponse {
  string version = 1;
  string os = 2;
  string binary_info = 3;
  string report_time = 4;
  repeated SubscriptionUnitInfo unit_detail = 5;
  SubscriptionSummaryInfo unit_summary = 6;
  string checksum = 7;
  map<string, string> extra_fields = 100;
}

// ==========================================================================
// show: typisierte Felder je Ressourcentyp plus alle Direktiven als
// google.protobuf.Struct (Schluessel wie in "show" mit ".api 2")
// ==========================================================================

message DirectorResourceInfo {
  string name = 1;
  string description = 2;
  string messages = 3;
  uint32 maximumconcurrentjobs = 4;
  bool auditing = 5;
  string workingdirectory = 6;
  google.protobuf.Struct directives = 99;
}

message ClientResourceInfo {
  string name = 1;
  string description = 2;
  string address = 3;
  uint32 fdport = 4;
  string protocol = 5;
  bool enabled = 6;
  string catalog = 7;
  uint32 maximumconcurrentjobs = 8;
  google.protobuf.Struct directives = 99;
}

// Job und JobDefs
message JobResourceInfo {
  string name = 1;
  string description = 2;
  JobType type = 3;
  JobLevel level = 4;
  string client = 5;
  string fileset = 6;
  string pool = 7;
  repeated string storage = 8;
  string schedule = 9;
  string messages = 10;
  string jobdefs = 11;
  bool enabled = 12;
  uint32 priority = 13;
  uint32 maximumconcurrentjobs = 14;
  string where = 15;
  google.protobuf.Struct directives = 99;
}

message StorageResourceInfo {
  string name = 1;
  string description = 2;
  string address = 3;
  uint32 sdport = 4;
  repeated string device = 5;
  string mediatype = 6;
  bool autochanger = 7;
  bool enabled = 8;
  uint32 maximumconcurrentjobs = 9;
  google.protobuf.Struct directives = 99;
}

message CatalogResourceInfo {
  string name = 1;
  string description = 2;
  string dbname = 3;
  string dbuser = 4;
  string dbaddress = 5;
  uint32 dbport = 6;
  google.protobuf.Struct directives = 99;
}

message ScheduleResourceInfo {
  string name = 1;
  string description = 2;
  repeated string run = 3;
  bool enabled = 4;
  google.protobuf.Struct directives = 99;
}

message PoolResourceInfo {
  string name = 1;
  string description = 2;
  string pooltype = 3;
  string labelformat = 4;
  uint32 maximumvolumes = 5;
  repeated string storage = 6;
  string recyclepool = 7;
  string volumeretention = 8;    // wie konfiguriert, z.B. "1 months "
  string maximumvolumebytes = 9; // wie konfiguriert, z.B. "50 g"
  google.protobuf.Struct directives = 99;
}

// Console, Profile und User
message ConsoleResourceInfo {
  string name = 1;
  string description = 2;
  repeated string profile = 3;
  repeated string jobacl = 4;
  repeated string clientacl = 5;
  repeated string storageacl = 6;
  repeated string scheduleacl = 7;
  repeated string poolacl = 8;
  repeated string commandacl = 9;
  repeated string filesetacl = 10;
  repeated string catalogacl = 11;
  repeated string whereacl = 12;
  repeated string pluginoptionsacl = 13;
  google.protobuf.Struct directives = 99;
}

// FileSet, Messages, Counter: nur Name/Beschreibung typisiert
message GenericResourceInfo {
  string name = 1;
  string description = 2;
  google.protobuf.Struct directives = 99;
}

message ShowResponse {
  map<string, DirectorResourceInfo> directors = 1;
  map<string, ClientResourceInfo> clients = 2;
  map<string, JobResourceInfo> jobdefs = 3;
  map<string, JobResourceInfo> jobs = 4;
  map<string, StorageResourceInfo> storages = 5;
  map<string, CatalogResourceInfo> catalogs = 6;
  map<string, ScheduleResourceInfo> schedules = 7;
  map<string, GenericResourceInfo> filesets = 8;
  map<string, PoolResourceInfo> pools = 9;
  map<string, GenericResourceInfo> messages = 10;
  map<string, ConsoleResourceInfo> consoles = 11;
  map<string, ConsoleResourceInfo> profiles = 12;
  map<string, ConsoleResourceInfo> users = 13;
  map<string, GenericResourceInfo> counters = 14;
  string text = 15;              // Ressourcen ohne API-2-Ausgabe
}

message DisabledInfo {
  repeated string jobs = 1;
  repeated string clients = 2;
  repeated string schedules = 3;
}

message ShowDisabledResponse {
  DisabledInfo disabled = 1;
}

// ==========================================================================
// Punkt-Befehle
// ==========================================================================

message LevelInfo {
  string name = 1;
  JobLevel level = 2;
  JobType jobtype = 3;
  map<string, string> extra_fields = 100;
}

message LevelListResponse {
  repeated LevelInfo levels = 1;
}

message JobStatusInfo {
  JobStatus jobstatus = 1;
  string jobstatuslong = 2;
  uint32 severity = 3;
  uint32 exitlevel = 4;
  string exitstatus = 5;
  map<string, string> extra_fields = 100;
}

message JobStatusListResponse {
  repeated JobStatusInfo jobstatus = 1;
}

// .defaults job=|client=|storage=|pool=
message DefaultsInfo {
  string job = 1;
  string pool = 2;
  string messages = 3;
  string client = 4;
  string storage = 5;
  string where = 6;
  JobLevel level = 7;
  JobType type = 8;
  string fileset = 9;
  bool enabled = 10;
  string catalog = 11;
  map<string, string> extra_fields = 100;
}

message DefaultsResponse {
  DefaultsInfo defaults = 1;
}

message AuthorizedInfo {
  bool authorized = 1;
}

message AuthorizedResponse {
  AuthorizedInfo authorized = 1;
}

message SqlTableInfo {
  string tablename = 1;
  optional uint64 count = 2;     // nur .sqlcount
  map<string, string> extra_fields = 100;
}

message SqlTablesResponse {
  repeated SqlTableInfo sqltables = 1;
  repeated SqlTableInfo sqlcount = 2;
}

message SqlColumnInfo {
  string table_name = 1;
  string column_name = 2;
  string data_type = 3;
  map<string, string> extra_fields = 100;
}

message SqlSchemaResponse {
  repeated SqlColumnInfo sqlschema = 1;
}

// Ergebniszeile einer SQL-Abfrage: Spaltenname -> Wert
message SqlRowInfo {
  map<string, string> extra_fields = 100;
}

message SqlQueryResponse {
  repeated SqlRowInfo query = 1;
  string text = 2;
}

message AclEntryInfo {
  string value = 1;
  string source = 2;             // Herkunft, z.B. "Profile operator"
}

message ConsoleAclInfo {
  string console = 1;
  repeated string profiles = 2;
  repeated AclEntryInfo jobacl = 3;
  repeated AclEntryInfo clientacl = 4;
  repeated AclEntryInfo storageacl = 5;
  repeated AclEntryInfo scheduleacl = 6;
  repeated AclEntryInfo poolacl = 7;
  repeated AclEntryInfo commandacl = 8;
  repeated AclEntryInfo filesetacl = 9;
  repeated AclEntryInfo catalogacl = 10;
  repeated AclEntryInfo whereacl = 11;
  repeated AclEntryInfo pluginoptionsacl = 12;
  map<string, string> extra_fields = 100;
}

message AclListResponse {
  repeated ConsoleAclInfo acl = 1;
}

// ==========================================================================
// BVFS / OVFS
// ==========================================================================

message BvfsJobIdInfo {
  uint32 id = 1;
}

message BvfsJobIdsResponse {
  repeated BvfsJobIdInfo jobids = 1;
}

// stat-Struktur (aus LStat dekodiert)
message BvfsStatInfo {
  uint64 dev = 1;
  uint64 ino = 2;
  uint32 mode = 3;
  uint32 nlink = 4;
  uint32 uid = 5;
  uint32 gid = 6;
  string user = 7;
  string group = 8;
  uint64 rdev = 9;
  uint64 size = 10;
  int64 atime = 11;
  int64 mtime = 12;
  int64 ctime = 13;
  map<string, string> extra_fields = 100;
}

message BvfsEntryInfo {
  string type = 1;               // "D" Verzeichnis, "F" Datei, "V" Version
  uint64 pathid = 2;
  uint64 fileid = 3;
  uint32 jobid = 4;
  string lstat = 5;
  string name = 6;
  string fullpath = 7;
  string md5 = 8;
  string volumename = 9;
  bool volumeinchanger = 10;
  BvfsStatInfo stat = 11;
  uint32 linkfileindex = 12;
  map<string, string> extra_fields = 100;
}

message BvfsListResponse {
  repeated BvfsEntryInfo directories = 1;
  repeated BvfsEntryInfo files = 2;
  repeated BvfsEntryInfo versions = 3;
}

message OvfsStatusInfo {
  string state = 1;
  bool installed = 2;
  bool usable = 3;
  optional string version = 4;
  string path = 5;               // "ovfs" oder "fallback"
  optional string schema = 6;
  optional string reason = 7;
  map<string, string> extra_fields = 100;
}

message OvfsStatusResponse {
  OvfsStatusInfo ovfs = 1;
}

message OvfsLatestResponse {
  string path = 1;
  string client = 2;
  repeated uint32 jobids = 3;
}

message OvfsTreeResponse {
  string path = 1;
  repeated uint32 jobids = 2;
  string root = 3;
  uint32 depth = 4;
  google.protobuf.Value tree = 5;  // Baum wie von der Erweiterung geliefert
}

message OvfsDeltaPartInfo {
  uint32 jobid = 1;
  uint32 fileindex = 2;
}

message OvfsEntryInfo {
  string name = 1;
  string name_b64 = 2;
  string path = 3;
  string path_b64 = 4;
  string kind = 5;
  uint32 jobid = 6;
  uint64 fileid = 7;
  uint32 fileindex = 8;
  uint32 delta_seq = 9;
  repeated OvfsDeltaPartInfo delta_parts = 10;
  uint32 mode = 11;
  uint32 uid = 12;
  uint32 gid = 13;
  uint64 size = 14;
  int64 mtime = 15;
  uint32 link_fileindex = 16;
  uint64 entries = 17;
  map<string, string> extra_fields = 100;
}

message OvfsLsResponse {
  string path = 1;
  repeated uint32 jobids = 2;
  string dir = 3;
  repeated OvfsEntryInfo entries = 4;
}

message OvfsVersionInfo {
  uint32 jobid = 1;
  string level = 2;
  string job_type = 3;
  int64 jobtdate = 4;
  string starttime = 5;
  uint64 fileid = 6;
  uint32 fileindex = 7;
  uint32 delta_seq = 8;
  string md5 = 9;
  uint32 mode = 10;
  uint32 uid = 11;
  uint32 gid = 12;
  uint64 size = 13;
  int64 mtime = 14;
  map<string, string> extra_fields = 100;
}

message OvfsVersionsResponse {
  string path = 1;
  string client = 2;
  string dir = 3;
  string name = 4;
  repeated OvfsVersionInfo versions = 5;
}

// ==========================================================================
// Interaktive Wiederherstellung (S-35)
// ==========================================================================

message RestoreSessionResponse {
  string session_id = 1;         // fuer die RestoreTree*-RPCs
  repeated uint32 jobids = 2;    // Jobs, aus denen der Baum gebaut wurde
  uint64 files = 3;              // Dateien im Baum
  string cwd = 4;
  string text = 5;
}

message RestoreTreeEntryInfo {
  string name = 1;
  bool is_dir = 2;
  bool marked = 3;
  uint32 jobid = 4;
  uint32 fileindex = 5;
}

message RestoreTreeListResponse {
  string cwd = 1;
  repeated RestoreTreeEntryInfo entries = 2;
  string text = 3;
}

message RestoreTreeCountResponse {
  uint64 total = 1;
  uint64 marked = 2;
  uint64 bytes = 3;              // estimate
  string text = 4;
}
